llm:
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  timeout: 120
  api_key_env: LLM_API_KEY

http:
  user_agent: "sci-etl-project/0.1 (mailto:you@example.org)"
  max_retries: 4
  backoff_factor: 5.0
  timeout: 25

# mailto joins OpenAlex's polite pool, which allows 10 requests per second.
full_text:
  max_rate: 5
  time_period: 1.0

pipeline:
  search_query: metformin type 2 diabetes randomized trial
  total_limit: 20
  page_size: 100
  sleep_between: 1.0
  max_concurrency: 2

source:
  kind: openalex
  api_key_env: SOURCE_API_KEY
  filter: type:article,from_publication_date:2015-01-01
  mailto: you@example.org

prompts:
  relevance: prompts/relevance.txt
  extraction: prompts/extraction.txt
  result_key: trials

export:
  destination: out/trials.csv
  key_column: intervention
  value_columns: [participants, duration_weeks, hba1c_change_percent]

state:
  backend: file
  processed_ids: state/processed_ids.txt
  metadata: state/metadata.json

logging:
  file: logs/run.log
  level: INFO
